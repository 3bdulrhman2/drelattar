<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 540" width="100%" height="100%" style="background:#efeae2; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Arabic', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- WhatsApp Header -->
  <rect width="420" height="70" fill="#075e54"/>
  <circle cx="45" cy="35" r="20" fill="#128c7e"/>
  <circle cx="45" cy="30" r="8" fill="#ffffff" opacity="0.9"/>
  <path d="M33 46 C33 39 57 39 57 46" fill="#ffffff" opacity="0.9"/>
  
  <text x="75" y="32" fill="#ffffff" font-size="15" font-weight="bold" direction="rtl">د. محمد السيد العطار</text>
  <text x="75" y="50" fill="#cbfaf4" font-size="11" direction="rtl">متصل الآن • واتساب رسمي</text>

  <circle cx="385" cy="35" r="3" fill="#ffffff"/>
  <circle cx="375" cy="35" r="3" fill="#ffffff"/>
  <circle cx="365" cy="35" r="3" fill="#ffffff"/>

  <!-- Wallpaper pattern subtle -->
  <path d="M0 70 L420 70 L420 540 L0 540 Z" fill="#efeae2"/>

  <!-- Date Chip -->
  <rect x="155" y="85" width="110" height="24" rx="8" fill="#e1f3fb" filter="url(#shadow)"/>
  <text x="210" y="101" fill="#52707e" font-size="10.5" font-weight="600" text-anchor="middle">الخميس، 10:30 ص</text>

  <!-- Patient Message Bubble -->
  <g filter="url(#shadow)">
    <rect x="25" y="125" width="370" height="195" rx="16" fill="#ffffff"/>
    <polygon points="390,135 405,145 390,155" fill="#ffffff"/>
    
    <text x="380" y="152" fill="#111b21" font-size="13" font-weight="600" direction="rtl">أ / محمود عبد الرحمن (مرافق مريض)</text>
    
    <text x="380" y="180" fill="#3b4a54" font-size="12.5" direction="rtl">السلام عليكم ورحمة الله يا دكتور محمد</text>
    <text x="380" y="205" fill="#3b4a54" font-size="12.5" direction="rtl">حبيت أشكر حضرتك جداً على اهتمامك وتشخيصك لوالدي،</text>
    <text x="380" y="230" fill="#3b4a54" font-size="12.5" direction="rtl">كان عنده ضيق تنفس حاد وتعبان جداً بالليل، وحضرتك</text>
    <text x="380" y="255" fill="#3b4a54" font-size="12.5" direction="rtl">عملتله سونار ورسم قلب وظبطت جرعات السكر والضغط.</text>
    <text x="380" y="280" fill="#008069" font-size="12.5" font-weight="bold" direction="rtl">الحمد لله حالته مستقرة جداً وبقى يتنفس طبيعي تماماً</text>
    <text x="380" y="304" fill="#3b4a54" font-size="12" direction="rtl">ربنا يبارك في علمك وصحتك وضميرك الحي يا دكتور.</text>
    
    <text x="40" y="310" fill="#667781" font-size="10">10:32 ص</text>
  </g>

  <!-- Doctor Reply Bubble -->
  <g filter="url(#shadow)">
    <rect x="45" y="335" width="350" height="135" rx="16" fill="#d9fdd3"/>
    <polygon points="45,345 30,355 45,365" fill="#d9fdd3"/>

    <text x="375" y="362" fill="#008069" font-size="12" font-weight="bold" direction="rtl">د. محمد السيد العطار</text>

    <text x="375" y="390" fill="#111b21" font-size="12.5" direction="rtl">وعليكم السلام ورحمة الله وبركاته يا أستاذ محمود،</text>
    <text x="375" y="415" fill="#111b21" font-size="12.5" direction="rtl">ألف حمد لله على سلامة الوالد وربنا يتم شفاه على خير.</text>
    <text x="375" y="440" fill="#111b21" font-size="12.5" direction="rtl">ده واجبي، وأهم حاجة الالتزام بالعلاج وميعاد الاستشارة.</text>

    <!-- Blue ticks -->
    <path d="M55 457 L59 462 L67 453" stroke="#53bdeb" stroke-width="1.8" fill="none"/>
    <path d="M60 457 L64 462 L72 453" stroke="#53bdeb" stroke-width="1.8" fill="none"/>
    <text x="80" y="461" fill="#667781" font-size="10">10:35 ص</text>
  </g>

  <!-- Bottom WhatsApp badge -->
  <rect x="120" y="490" width="180" height="30" rx="15" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="140" cy="505" r="8" fill="#25d366"/>
  <path d="M137 502 L143 508 M143 502 L137 508" stroke="#ffffff" stroke-width="1.2"/>
  <text x="215" y="510" fill="#075e54" font-size="11" font-weight="bold" text-anchor="middle">محادثة واتساب موثقة 100%</text>
</svg>
