<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 540" width="100%" height="100%" style="background:#efeae2; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Arabic', sans-serif;">
  <defs>
    <filter id="shadow-wa2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- WhatsApp Header -->
  <rect width="420" height="70" fill="#075e54"/>
  <circle cx="45" cy="35" r="20" fill="#128c7e"/>
  <circle cx="45" cy="30" r="8" fill="#ffffff" opacity="0.9"/>
  <path d="M33 46 C33 39 57 39 57 46" fill="#ffffff" opacity="0.9"/>
  
  <text x="75" y="32" fill="#ffffff" font-size="15" font-weight="bold" direction="rtl">د. محمد السيد العطار</text>
  <text x="75" y="50" fill="#cbfaf4" font-size="11" direction="rtl">متصل الآن • استشارة عاجلة</text>

  <circle cx="385" cy="35" r="3" fill="#ffffff"/>
  <circle cx="375" cy="35" r="3" fill="#ffffff"/>
  <circle cx="365" cy="35" r="3" fill="#ffffff"/>

  <!-- Date Chip -->
  <rect x="155" y="85" width="110" height="24" rx="8" fill="#e1f3fb" filter="url(#shadow-wa2)"/>
  <text x="210" y="101" fill="#52707e" font-size="10.5" font-weight="600" text-anchor="middle">أمس، 08:15 م</text>

  <!-- Patient Message Bubble -->
  <g filter="url(#shadow-wa2)">
    <rect x="25" y="125" width="370" height="180" rx="16" fill="#ffffff"/>
    <polygon points="390,135 405,145 390,155" fill="#ffffff"/>
    
    <text x="380" y="152" fill="#111b21" font-size="13" font-weight="600" direction="rtl">د / طارق عبد المنعم (طبيب زميل ومريض)</text>
    
    <text x="380" y="180" fill="#3b4a54" font-size="12.5" direction="rtl">مساء الخير يا دكتور محمد يا غالي،</text>
    <text x="380" y="205" fill="#3b4a54" font-size="12.5" direction="rtl">والله أنا كطبيب زميل شهادتي فيك مجروحة، لكن دقتك</text>
    <text x="380" y="230" fill="#3b4a54" font-size="12.5" direction="rtl">في تشخيص أمراض الباطنة وتعاملك السريع مع الحالات الحرجة</text>
    <text x="380" y="255" fill="#008069" font-size="12.5" font-weight="bold" direction="rtl">والعناية المركزة شيء يدعو للفخر بأبناء الأزهر الشريف.</text>
    <text x="380" y="280" fill="#3b4a54" font-size="12" direction="rtl">متابعة السكر التراكمي وجلسات التنفس فارقة جداً مع الناس.</text>
    
    <text x="40" y="295" fill="#667781" font-size="10">08:16 م</text>
  </g>

  <!-- Doctor Reply Bubble -->
  <g filter="url(#shadow-wa2)">
    <rect x="45" y="325" width="350" height="120" rx="16" fill="#d9fdd3"/>
    <polygon points="45,335 30,345 45,355" fill="#d9fdd3"/>

    <text x="375" y="352" fill="#008069" font-size="12" font-weight="bold" direction="rtl">د. محمد السيد العطار</text>

    <text x="375" y="378" fill="#111b21" font-size="12.5" direction="rtl">حبيبي وأخي الغالي دكتور طارق،</text>
    <text x="375" y="403" fill="#111b21" font-size="12.5" direction="rtl">كلامك وسام على صدري وأعتز بيه جداً من أخ عزيز وطبيب متميز.</text>
    <text x="375" y="426" fill="#111b21" font-size="12" direction="rtl">ربنا ينفع بينا ويقدرنا دائماً على خدمة أهالينا الكرام.</text>

    <path d="M55 433 L59 438 L67 429" stroke="#53bdeb" stroke-width="1.8" fill="none"/>
    <path d="M60 433 L64 438 L72 429" stroke="#53bdeb" stroke-width="1.8" fill="none"/>
    <text x="80" y="437" fill="#667781" font-size="10">08:20 م</text>
  </g>

  <!-- Bottom WhatsApp badge -->
  <rect x="110" y="480" width="200" height="32" rx="16" fill="#ffffff" filter="url(#shadow-wa2)"/>
  <circle cx="130" cy="496" r="8" fill="#25d366"/>
  <text x="215" y="501" fill="#075e54" font-size="11" font-weight="bold" text-anchor="middle">محادثة واتساب موثقة 100%</text>
</svg>
