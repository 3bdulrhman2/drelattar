<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 540" width="100%" height="100%" style="background:#f0f2f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Arabic', sans-serif;">
  <defs>
    <filter id="shadow-fb" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Facebook Card Container -->
  <rect x="15" y="15" width="390" height="510" rx="20" fill="#ffffff" filter="url(#shadow-fb)"/>

  <!-- Top bar / Facebook badge -->
  <rect x="15" y="15" width="390" height="60" rx="20" fill="#ffffff"/>
  <rect x="35" y="30" width="32" height="32" rx="16" fill="#1877f2"/>
  <text x="51" y="52" fill="#ffffff" font-size="20" font-weight="black" text-anchor="middle">f</text>
  
  <text x="80" y="45" fill="#1877f2" font-size="13" font-weight="bold" direction="rtl">توصية على فيسبوك • Facebook Recommendation</text>
  <text x="80" y="60" fill="#65676b" font-size="11" direction="rtl">منشور عام موثق عبر المجموعة الرسمية</text>

  <line x1="25" y1="78" x2="395" y2="78" stroke="#e4e6eb" stroke-width="1"/>

  <!-- User Profile Section -->
  <circle cx="360" cy="115" r="24" fill="#e4e6eb"/>
  <circle cx="360" cy="108" r="9" fill="#8a8d91"/>
  <path d="M344 128 C344 120 376 120 376 128" fill="#8a8d91"/>

  <text x="325" y="110" fill="#050505" font-size="14" font-weight="bold" direction="rtl">م / إبراهيم السيد الشافعي</text>
  <text x="325" y="128" fill="#65676b" font-size="11" direction="rtl">يوصي بـ <tspan fill="#1877f2" font-weight="bold">د. محمد السيد العطار</tspan> • 🌟 5 نجوم</text>
  <text x="325" y="144" fill="#8a8d91" font-size="10.5" direction="rtl">منذ أسبوعين • 🌐 عام</text>

  <!-- Recommendation Tag Box -->
  <rect x="35" y="160" width="350" height="38" rx="12" fill="#e7f3ff"/>
  <text x="365" y="184" fill="#1877f2" font-size="12" font-weight="bold" direction="rtl">✨ يوصي بشدة بزيارة العيادة والاستشارة الطبية</text>

  <!-- Post Body Text -->
  <g direction="rtl">
    <text x="375" y="225" fill="#050505" font-size="13.5" font-weight="bold" direction="rtl">شهادة حق وواجب أقولها لوجه الله..</text>
    <text x="375" y="255" fill="#1c1e21" font-size="12.5" direction="rtl">الدكتور محمد السيد العطار من أمهر وأشطر أطباء الباطنة</text>
    <text x="375" y="280" fill="#1c1e21" font-size="12.5" direction="rtl">والعناية المركزة في الحسينية ومحافظة الشرقية بالكامل.</text>
    <text x="375" y="310" fill="#1c1e21" font-size="12.5" direction="rtl">العيادة مجهزة بأحدث أجهزة السونار ورسم القلب وقياس</text>
    <text x="375" y="335" fill="#1c1e21" font-size="12.5" direction="rtl">الأكسجين، وبيشرحلك حالتك خطوة بخطوة وبمنتهى الأمانة</text>
    <text x="375" y="360" fill="#1c1e21" font-size="12.5" direction="rtl">وبدون أي مصاريف أو تحاليل ملهاش داعي.</text>
    <text x="375" y="390" fill="#008069" font-size="13" font-weight="bold" direction="rtl">من أرقى وأخلص الدكاترة اللي اتعاملت معاهم، ربنا يوفقك دايماً.</text>
  </g>

  <!-- Divider -->
  <line x1="35" y1="420" x2="385" y2="420" stroke="#e4e6eb" stroke-width="1"/>

  <!-- Engagement Stats -->
  <circle cx="365" cy="440" r="10" fill="#1877f2"/>
  <text x="365" y="444" fill="#ffffff" font-size="10" text-anchor="middle">👍</text>
  <circle cx="350" cy="440" r="10" fill="#fa3e3e"/>
  <text x="350" y="444" fill="#ffffff" font-size="10" text-anchor="middle">❤️</text>
  <text x="330" y="445" fill="#65676b" font-size="11" direction="rtl">184 تفاعل</text>
  <text x="50" y="445" fill="#65676b" font-size="11">32 تعليق • 8 مشاركات</text>

  <!-- Action Bar -->
  <rect x="35" y="465" width="350" height="42" rx="10" fill="#f0f2f5"/>
  <text x="320" y="491" fill="#1877f2" font-size="12" font-weight="bold" direction="rtl">👍 أعجبني</text>
  <text x="210" y="491" fill="#65676b" font-size="12" font-weight="bold" direction="rtl">💬 تعليق</text>
  <text x="90" y="491" fill="#65676b" font-size="12" font-weight="bold" direction="rtl">↗️ مشاركة</text>
</svg>
