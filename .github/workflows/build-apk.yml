name: Build clinic app APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build release APK
        working-directory: mobile_app
        run: |
          mkdir -p assets/fonts
          curl -fsSL 'https://fonts.gstatic.com/s/cairo/v31/SLXgc1nY6HkvangtZmpQdkhzfH5lkSs2SgRjCAGMQ1z0hOA-W1Q.ttf' -o assets/fonts/Arabic-Regular.ttf
          curl -fsSL 'https://fonts.gstatic.com/s/cairo/v31/SLXgc1nY6HkvangtZmpQdkhzfH5lkSs2SgRjCAGMQ1z0hAc5W1Q.ttf' -o assets/fonts/Arabic-Bold.ttf
          flutter pub get
          flutter test --update-goldens test/widget_test.dart
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --dart-define=SUPABASE_URL=https://jpamutyomblwobwntoky.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_0WaaRxegFhmOhqRgrRQFXA_p39Y-RXQ
      - uses: actions/upload-artifact@v4
        with:
          name: clinic-app-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
