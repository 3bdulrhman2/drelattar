name: Build clinic app APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test staff endpoint without live accounts
        run: node --experimental-strip-types --test tests/staff-handler.test.ts
      - name: Build release APK
        working-directory: mobile_app
        run: |
          mkdir -p assets/fonts
          curl -fsSL 'https://fonts.gstatic.com/s/cairo/v31/SLXgc1nY6HkvangtZmpQdkhzfH5lkSs2SgRjCAGMQ1z0hOA-W1Q.ttf' -o assets/fonts/Arabic-Regular.ttf
          curl -fsSL 'https://fonts.gstatic.com/s/cairo/v31/SLXgc1nY6HkvangtZmpQdkhzfH5lkSs2SgRjCAGMQ1z0hAc5W1Q.ttf' -o assets/fonts/Arabic-Bold.ttf
          flutter pub get
          flutter test --update-goldens test/widget_test.dart test/integrated_test.dart test/notification_hold_test.dart test/small_test.dart test/staff_contract_test.dart test/secretary_parity_test.dart test/staff_push_screen_test.dart test/reception_preview_test.dart
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --dart-define=SUPABASE_URL=https://jpamutyomblwobwntoky.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_0WaaRxegFhmOhqRgrRQFXA_p39Y-RXQ
          manifest=$(find build/app/intermediates/merged_manifest/release -name AndroidManifest.xml | head -1)
          test -n "$manifest"
          grep -q 'com.google.firebase.messaging.FirebaseMessagingService' "$manifest"
          grep -q 'firebase_messaging_auto_init_enabled' "$manifest"
          apk=$(find build/app/outputs -name '*release*.apk' | head -1)
          test -n "$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          if "$signer" verify "$apk"; then
            echo 'Verification build must be unsigned'; exit 1
          fi
          echo 'Unsigned staff-push-prepared package verified; not for installation.'
      - uses: actions/upload-artifact@v4
        with:
          name: clinic-staff-push-prepared-unsigned
          path: mobile_app/build/app/outputs/flutter-apk/*release*.apk
