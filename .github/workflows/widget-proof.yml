name: Widget emulator proof
on:
  workflow_dispatch:
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare assets
        working-directory: mobile_app
        run: |
          python3 -m pip install --quiet pillow
          python3 generate_branding.py
          mkdir -p assets/fonts
          curl -fsSL 'https://fonts.gstatic.com/s/cairo/v31/SLXgc1nY6HkvangtZmpQdkhzfH5lkSs2SgRjCAGMQ1z0hOA-W1Q.ttf' -o assets/fonts/Arabic-Regular.ttf
          curl -fsSL 'https://fonts.gstatic.com/s/cairo/v31/SLXgc1nY6HkvangtZmpQdkhzfH5lkSs2SgRjCAGMQ1z0hAc5W1Q.ttf' -o assets/fonts/Arabic-Bold.ttf
          flutter pub get
          flutter build apk --debug --target-platform android-x64 \
            --dart-define=SUPABASE_URL=https://jpamutyomblwobwntoky.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_0WaaRxegFhmOhqRgrRQFXA_p39Y-RXQ
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r mobile_app/build/app/outputs/flutter-apk/app-debug.apk
            adb shell cmd appwidget grantbind --package com.drelattar.my_clinic --user 0
            adb shell am start -n com.drelattar.my_clinic/.WidgetProofActivity
            sleep 8
            adb exec-out screencap -p > widgets-proof.png
            adb shell dumpsys appwidget | head -60 > appwidget-dump.txt
      - uses: actions/upload-artifact@v4
        with:
          name: widget-emulator-proof
          path: |
            widgets-proof.png
            appwidget-dump.txt
